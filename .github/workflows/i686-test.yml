name: i686 manylinux experiment

# Throwaway: runs the release i686 manylinux wheel steps under several configurations.
on:
  push:
    branches: [ci-test-i686-manylinux]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: status-quo-ubuntu-latest, os: ubuntu-latest, manylinux: auto }
          - { variant: pin-ubuntu-24.04, os: ubuntu-24.04, manylinux: auto }
          - { variant: seccomp-unconfined, os: ubuntu-latest, manylinux: auto, docker-options: '--security-opt seccomp=unconfined' }
          - { variant: zig, os: ubuntu-latest, manylinux: auto, extra-args: '--zig' }
          - { variant: manylinux_2_28, os: ubuntu-latest, manylinux: '2_28' }
          - { variant: musllinux-control, os: ubuntu-latest, manylinux: musllinux_1_2 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Environment
      run: |
        lsb_release -ds
        docker version --format 'docker client {{.Client.Version}} server {{.Server.Version}}'
    - name: "Diagnostic: DNS inside manylinux2014_i686, default seccomp"
      continue-on-error: true
      run: docker run --rm quay.io/pypa/manylinux2014_i686 getent hosts vault.centos.org
    - name: "Diagnostic: DNS inside manylinux2014_i686, seccomp=unconfined"
      continue-on-error: true
      run: docker run --rm --security-opt seccomp=unconfined quay.io/pypa/manylinux2014_i686 getent hosts vault.centos.org
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Stamp release version into Cargo.toml
      shell: bash
      run: python tooling/scripts/write-cargo-version.py "6.170.16"
    - name: Build abi3 wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        target: i686
        manylinux: ${{ matrix.manylinux }}
        docker-options: ${{ matrix.docker-options }}
        args: --release --out dist --features abi3 ${{ matrix.extra-args }}
        working-directory: hypothesis
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: abi3t-python
      with:
        python-version: '3.15'
    - name: Build abi3t wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        target: i686
        manylinux: ${{ matrix.manylinux }}
        docker-options: ${{ matrix.docker-options }}
        args: --release --out dist --features abi3t --interpreter python3.15 ${{ matrix.extra-args }}
        working-directory: hypothesis
    - name: Built wheels
      if: always()
      run: ls -la hypothesis/dist/ || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ matrix.variant }}
        path: hypothesis/dist/*.whl
